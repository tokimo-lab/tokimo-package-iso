[package]
name        = "tokimo-package-iso"
version     = "0.1.0"
edition     = "2024"
rust-version = "1.94.0"
license     = "MIT OR Apache-2.0"
description = "Blu-ray ISO reading and M2TS extraction for remote VFS sources"
repository  = "https://github.com/tokimo-lab/tokimo-package-iso"

[dependencies]
tokio              = { version = "1", features = ["rt-multi-thread", "macros", "sync", "fs"] }
tracing            = "0.1"
serde              = { version = "1", features = ["derive"] }
serde_json         = "1"
bytes              = "1"
tokimo-vfs         = { git = "https://github.com/tokimo-lab/tokimo-package-vfs.git", rev = "17e3c7a9fe04131e9c58341f77d642fadac5e391" }
tokimo-package-ffmpeg = { git = "https://github.com/tokimo-lab/tokimo-package-ffmpeg.git", rev = "9ea65ce92ead37f4fff80c9d4bdcd43e03622ee3" }

[profile.release]
lto       = "thin"
opt-level = 3
strip     = "symbols"
